[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-auto-effort"
version = "0.4.0a1"
description = "Choose an agent's reasoning effort from its incoming request with Jev."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.2,<0.8"]
openrouter = ["openrouter>=1.3.32,<1.4"]
providers = ["typesafe-sdk>=0.7.2,<0.8", "openrouter>=1.3.32,<1.4"]
dev = ["pytest>=8,<9", "build>=1,<2"]

[project.scripts]
auto-effort = "auto_effort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_effort = ["py.typed", "skills/auto-subagents/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
