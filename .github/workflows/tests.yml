name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[dev,providers]'
      - run: python scripts/check_release.py --output "${{ runner.temp }}/auto-effort-release"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/auto-effort-release/RELEASE-MANIFEST.json
            ${{ runner.temp }}/auto-effort-release/*.whl
            ${{ runner.temp }}/auto-effort-release/*.tar.gz
            ${{ runner.temp }}/auto-effort-release/*.log
